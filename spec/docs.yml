**PAYMENT SERVICE API SPECIFICATION**
info:
  description: API spec for Payment Service
  version: 1.0.0
  title: Payment Service API

servers:
  - url: http://localhost:8084

tags:
  - name: Health
    description: Health check endpoint
  - name: Payment
    description: Payment related endpoints

paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      operationId: healthCheck
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/payments:
    post:
      summary: Create a new payment
      tags: [Payment]
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Payment created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/payments/{id}:
    get:
      summary: Get payment by ID
      tags: [Payment]
      operationId: getPayment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Payment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: payment-service

    CreatePaymentRequest:
      type: object
      required:
        - reservation_id
        - payment_method
      properties:
        reservation_id:
          type: string
          format: uuid
          description: ID of the reservation to pay
        payment_method:
          type: string
          description: Payment method (must be QRIS)
          example: QRIS

    PaymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reservation_id:
          type: string
          format: uuid
        qr_string:
          type: string
        qr_url:
          type: string
        status:
          type: string
          enum: [PENDING, CONFIRMED, EXPIRED, SUCCEEDED, CANCELED, FAILED]
        amount:
          type: number
          format: double
        currency:
          type: string
          example: IDR
        expired_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

name: event-ticketing

# --- Postgres, single definition ------------------------------------------
# This file is the ONLY definition of the database. backend/docker-compose.yml
# pulls it in with `include`, so the full stack and "database only" are the
# same compose project (name: event-ticketing) and can never fight over
# port 5432.
#
# Defaults mirror backend/docker-compose.yml so the stack also starts when the
# project has no .env (compose only reads the .env of the project directory).
services:
  postgres:
    image: postgres:16-alpine
    container_name: event-ticketing-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiketid}
      POSTGRES_DB: ${POSTGRES_DB:-event_ticketing_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database-init.sh:/docker-entrypoint-initdb.d/database-init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
